<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0d47a1" />
  <link rel="manifest" href="/app1/manifest.json" />
  <link rel="icon" href="/app1/icons/icon-192.png" />
  <title>Control Fichaje</title>
  <style>
    body { display:flex; align-items:center; justify-content:center; height:100vh; margin:0; font-family:Arial, sans-serif; background:#ffffff; color:#0d47a1;}
    .logo { text-align:center; }
  </style>
</head>
<body>
  <div class="logo">
    <img src="/app1/icons/icon-192.png" alt="Fichaje" width="96" height="96" />
    <p>Abriendo Control Fichaje…</p>
  </div>

  <script>
    // Registrar service worker para cumplir requisito de "installable"
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/app1/sw.js').catch(e => console.warn('SW error', e));
    }

    // Redirigir a la web objetivo. Usamos replace para no dejar historial.
    const TARGET = 'https://controlfichaje.gruposherco.com/';
    setTimeout(() => {
      window.location.replace(TARGET);
    }, 350);
  </script>
</body>
</html>
